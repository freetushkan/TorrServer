# Fork only: try to move the fork commits onto every new upstream release tag.
# The scheduled run never touches master: on success it pushes branch
# sync/<tag> and opens an issue; on conflicts it opens an issue with the log.
# Run manually with "publish" checked to make master = sync/<tag>.
name: Fork upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to rebase onto (default: newest MatriX.*)"
        required: false
      publish:
        description: "Publish: replace master with the already checked branch sync/<tag>"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find tags
        id: tags
        run: |
          git remote add upstream https://github.com/YouROK/TorrServer.git
          git fetch --quiet --no-tags upstream '+refs/tags/MatriX.*:refs/tags/MatriX.*'
          NEW='${{ inputs.tag }}'
          [ -n "$NEW" ] || NEW=$(git tag -l 'MatriX.*' | grep -v -- '.MU.' | sort -V | tail -1)
          OLD=$(git describe --tags --abbrev=0 --match 'MatriX.*' --exclude '*.MU.*' HEAD)
          echo "old=$OLD new=$NEW"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse "$OLD^{commit}")" = "$(git rev-parse "$NEW^{commit}")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh issue list --state all --search "in:title \"Upstream $NEW\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "already handled $NEW"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.tags.outputs.skip != 'true'
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Rebase and verify
        id: rebase
        if: steps.tags.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          bash fork/rebase-onto.sh '${{ steps.tags.outputs.new }}' 2>&1 | tee rebase.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.rebase.outputs.code == '0'
        with:
          node-version: 20

      - name: Build web UI
        id: web
        if: steps.rebase.outputs.code == '0'
        run: |
          cd web && yarn install --frozen-lockfile && CI=false yarn build

      - name: Report
        if: steps.tags.outputs.skip != 'true' && always()
        run: |
          NEW='${{ steps.tags.outputs.new }}'
          OLD='${{ steps.tags.outputs.old }}'
          if [ '${{ steps.rebase.outputs.code }}' = '0' ] && [ '${{ steps.web.outcome }}' = 'success' ]; then
            git push --force origin "sync/$NEW"
            {
              echo "Коммиты форка перенесены с \`$OLD\` на \`$NEW\`: сборка, тесты, проверка хуков и веб — ок."
              echo
              echo "Опубликовать (всё в браузере):"
              echo "1. **Actions → Fork upstream sync → Run workflow**: tag \`$NEW\`, галочка **publish** → Run."
              echo "2. Когда он позеленеет: **Releases → Draft a new release → Choose a tag** → впишите \`$NEW.MU.r1\` → *Create new tag*, Target: \`master\` → **Publish release**."
              echo "   Это запустит сборку бинарников (Build and Release), они сами прикрепятся к релизу."
            } > body.md
            gh issue create --title "Upstream $NEW: ready" --body-file body.md
          else
            {
              echo "Автоматически перенести с \`$OLD\` на \`$NEW\` не получилось — нужен человек."
              echo
              echo "В терминале (или в Codespace): \`fork/rebase-onto.sh $NEW\`, поправить конфликты, \`fork/rebase-onto.sh --verify\`. Подсказки — fork/README.md."
              echo
              echo '```'
              tail -n 60 rebase.log 2>/dev/null || echo "(no log)"
              echo '```'
            } > body.md
            gh issue create --title "Upstream $NEW: needs attention" --body-file body.md
          fi

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: master = sync/<tag>
        run: |
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then
            TAG=$(git branch -r --list 'origin/sync/MatriX.*' | sed 's#.*origin/sync/##' | sort -V | tail -1)
          fi
          [ -n "$TAG" ] || { echo "no sync/* branch found"; exit 1; }
          git rev-parse -q --verify "origin/sync/$TAG" >/dev/null || { echo "no branch sync/$TAG — run without publish first"; exit 1; }
          echo "master: $(git rev-parse --short origin/master) -> $(git rev-parse --short origin/sync/$TAG)"
          git push --force origin "origin/sync/$TAG:refs/heads/master"
          N=$(gh issue list --state open --search "in:title \"Upstream $TAG: ready\"" --json number --jq '.[0].number')
          if [ -n "$N" ]; then
            gh issue close "$N" --comment "master обновлён до sync/$TAG. Осталось создать релиз с тегом $TAG.MU.r1 (Releases → Draft a new release)."
          fi
